<script>
(function(){
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
  function render(list){
    var el=document.getElementById("pdf-stories");
    if(!list.length){el.innerHTML="<p>No PDF stories yet.</p>";return;}
    el.innerHTML=list.map(function(s){
      return '<div class="card">'+(s.sample?'<span class="tag">Sample PDF</span>':'')+'<h3>'+esc(s.title)+'</h3><p class="meta">'+esc(s.date||"")+'</p><p>'+esc(s.summary||"")+'</p>'+(s.url?'<div class="pdf-actions"><a class="btn sm" href="'+esc(s.url)+'" target="_blank" rel="noopener">Read on '+esc(s.source||"site")+'</a></div></div>':'<div class="pdf-actions"><a class="btn sm" href="'+esc(s.file)+'" target="_blank" rel="noopener">Read PDF</a><a class="btn sm outline" href="'+esc(s.file)+'" download>Download</a></div></div>');
    }).join("");
  }
  var fallback=JSON.parse(document.getElementById("stories-data").textContent);
  if(location.protocol==="file:"){render(fallback);return;}
  fetch("stories/stories.json",{cache:"no-store"}).then(function(r){return r.json();}).then(render).catch(function(){render(fallback);});
})();
</script>
